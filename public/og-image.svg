<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A1B4E" />
      <stop offset="50%" stop-color="#4A2E80" />
      <stop offset="100%" stop-color="#6543A5" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#E5A93C" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Ambient Glow Shapes -->
  <circle cx="950" cy="180" r="280" fill="#E5A93C" opacity="0.12" filter="blur(60px)" />
  <circle cx="220" cy="460" r="320" fill="#8E54E9" opacity="0.25" filter="blur(70px)" />

  <!-- Decorative Grid lines -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="500" y1="0" x2="500" y2="630" />
    <line x1="700" y1="0" x2="700" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1100" y1="0" x2="1100" y2="630" />
  </g>

  <!-- Content Card Container -->
  <g transform="translate(120, 110)">
    <!-- Brand Pill -->
    <rect x="0" y="0" width="230" height="46" rx="23" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
    <path d="M28 23L33 14L38 23L47 28L38 33L33 42L28 33L19 28L28 23Z" fill="url(#goldGrad)" transform="translate(0, -5)" />
    <text x="56" y="29" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" letter-spacing="0.5">FESTORA AI ENGINE</text>

    <!-- Main Headline -->
    <text x="0" y="125" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="58" font-weight="800" letter-spacing="-1.5">
      Plan Unforgettable
    </text>
    <text x="0" y="195" fill="url(#goldGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="58" font-weight="800" letter-spacing="-1.5">
      Celebrations with AI
    </text>

    <!-- Description -->
    <text x="0" y="260" fill="rgba(255,255,255,0.85)" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="400">
      Deterministic budgets, structured milestones, vendor checklists &amp; schedules.
    </text>

    <!-- Badges Row -->
    <g transform="translate(0, 310)">
      <rect x="0" y="0" width="220" height="44" rx="10" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" />
      <text x="20" y="27" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">💍 Weddings &amp; Sangeet</text>

      <rect x="235" y="0" width="190" height="44" rx="10" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" />
      <text x="255" y="27" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">🎂 Milestone Birthdays</text>

      <rect x="440" y="0" width="210" height="44" rx="10" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" />
      <text x="460" y="27" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">🎓 College Festivals &amp; Galas</text>
    </g>
  </g>
</svg>
