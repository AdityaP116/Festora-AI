name: Festora AI Continuous Integration & Deployment Quality Gates

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  # =====================================================================
  # Stage 1: Source Validation, Linting & Static Analysis
  # =====================================================================
  source-validation:
    name: Stage 1 — Source Validation & Type Checking
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Run ESLint static analysis
        run: npm run lint

      - name: Verify frontend TypeScript types
        run: npx tsc -b

      - name: Install Cloud Functions dependencies
        run: npm --prefix functions ci

      - name: Verify Cloud Functions TypeScript types
        run: npm --prefix functions run build

  # =====================================================================
  # Stage 2: Security & Dependency Vulnerability Audits
  # =====================================================================
  security-audit:
    name: Stage 2 — Security & Vulnerability Audits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Run npm audit check (production packages)
        run: npm audit --omit=dev --audit-level=critical || true

      - name: Check for committed secrets / keys
        run: |
          echo "Scanning for accidental secret commits..."
          ! grep -rn "AIzaSy" src/ public/ functions/src/ || (echo "Potential API key committed!" && exit 1)

  # =====================================================================
  # Stage 3: Automated Test Suite & Code Coverage
  # =====================================================================
  test-and-coverage:
    name: Stage 3 — Unit, Contract, Persistence & E2E Suites
    runs-on: ubuntu-latest
    needs: [source-validation]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm --prefix functions ci

      - name: Execute Vitest Test Suites with Coverage
        run: npx vitest run --coverage
        env:
          NODE_ENV: test

  # =====================================================================
  # Stage 4: Production Artifact Build Verification
  # =====================================================================
  build-production-artifacts:
    name: Stage 4 — Production Build Validation
    runs-on: ubuntu-latest
    needs: [test-and-coverage]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Verify output bundle assets exist
        run: |
          test -f dist/index.html || exit 1
          echo "Vite distribution bundle generated successfully."

      - name: Build Cloud Functions production output
        run: npm --prefix functions run build

  # =====================================================================
  # Stage 5: Controlled Deployment Quality Gate
  # =====================================================================
  deploy-staging-gate:
    name: Stage 5 — Staging / Release Gate
    runs-on: ubuntu-latest
    needs: [build-production-artifacts, security-audit]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Report Release Gate Status
        run: |
          echo "All quality gates (linting, type-safety, unit tests, contract tests, security tests, and build) passed."
          echo "Artifact verified and ready for staging deployment upon credential provision."
