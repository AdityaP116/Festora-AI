name: Festora AI Production Deployment & Release Gates

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment target'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - frontend-vercel
          - backend-functions
          - firestore-rules

permissions:
  contents: read
  deployments: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  pre-deploy-validation:
    name: 1. Pre-Deployment Validation & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run TypeScript type checks
        run: npx tsc -b

      - name: Run test suite
        run: npm test

      - name: Build frontend production bundle
        run: npm run build

      - name: Build Cloud Functions
        run: npm --prefix functions run build

  deploy-firestore-and-backend:
    name: 2. Deploy Firestore Rules & Cloud Functions
    runs-on: ubuntu-latest
    needs: [pre-deploy-validation]
    if: github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'backend-functions' || github.event.inputs.target == 'firestore-rules'
    environment:
      name: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix functions ci

      - name: Build backend functions
        run: npm --prefix functions run build

      - name: Deploy to Firebase
        if: env.FIREBASE_TOKEN != '' || env.FIREBASE_SERVICE_ACCOUNT != ''
        run: |
          echo "Deploying Firebase Firestore Rules, Indexes, and Cloud Functions..."
          npx firebase-tools deploy --only firestore,functions --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Notice on Missing Firebase Credentials
        if: env.FIREBASE_TOKEN == '' && env.FIREBASE_SERVICE_ACCOUNT == ''
        run: |
          echo "::notice ::FIREBASE_TOKEN or FIREBASE_SERVICE_ACCOUNT not configured in GitHub Secrets. Skipping automated cloud deployment."

  deploy-frontend-vercel:
    name: 3. Deploy Frontend (Vercel)
    runs-on: ubuntu-latest
    needs: [pre-deploy-validation, deploy-firestore-and-backend]
    if: always() && (needs.pre-deploy-validation.result == 'success') && (github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'frontend-vercel')
    environment:
      name: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend production bundle
        run: npm run build

      - name: Deploy to Vercel
        if: env.VERCEL_TOKEN != ''
        run: |
          echo "Deploying frontend to Vercel production..."
          npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Notice on Missing Vercel Credentials
        if: env.VERCEL_TOKEN == ''
        run: |
          echo "::notice ::VERCEL_TOKEN not configured in GitHub Secrets. Vercel deployment can also occur automatically via Vercel GitHub App integration."
