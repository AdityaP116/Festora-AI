[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Netlify Secrets Scanner flags:
  # Netlify treats any value entered in the site's "Environment variables" dashboard as sensitive,
  # and will fail the build if any files (like .env.example, README.md, package.json, or bundled code)
  # match those strings (e.g. project name 'festora-ai', port numbers like 5001, 8080, 9099, or localhost IP 127.0.0.1).
  # We omit public Vite client config keys and common port/host variables from the secrets scanner.
  SECRETS_SCAN_OMIT_KEYS = "PORT,VITE_API_BASE_URL,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_AUTH_PORT,VITE_FIREBASE_EMULATOR_HOST,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_PROJECT_ID,FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_FIRESTORE_PORT,VITE_FIREBASE_MEASUREMENT_ID,VITE_FIREBASE_APP_ID"

# SPA Fallback: Redirect all routes to index.html for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache control and security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://apis.google.com https://*.firebaseio.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com http://localhost:5001 http://127.0.0.1:5001; img-src 'self' data: https:; frame-src 'self' https://*.firebaseapp.com;"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
